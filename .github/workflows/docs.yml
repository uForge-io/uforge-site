name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time; queue (don't cancel) whatever
# is waiting, so every push to main still gets deployed rather than being
# dropped by a later one. This is GitHub's own recommended block for the
# Pages deploy-pages action -- omitting it lets overlapping runs (e.g. two
# merges landing close together) leave stale artifacts attached to a run,
# which is what caused deploy-pages to fail with "Multiple artifacts named
# 'github-pages' were unexpectedly found for this workflow run."
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      # Eight language builds (Zensical builds one UI language per run). English
      # is the site root; each other language is built to site_<lang>/ and then
      # nested under site/<lang>/ so the header language menu, hreflang tags and
      # first-visit redirect (which all target /<lang>/<same page>) resolve.
      # --strict on every build: a broken link or missing page in ANY language
      # fails the deploy rather than shipping a half-working site.
      - name: Build all languages
        run: |
          languages="zh ja es de fr pt ru ko"
          zensical build --clean --strict --config-file zensical.toml
          for lang in $languages; do
            zensical build --clean --strict --config-file "zensical.${lang}.toml"
          done
      - name: Nest localized sites under the English site
        run: |
          for lang in zh ja es de fr pt ru ko; do
            rm -rf "site/${lang}"
            cp -R "site_${lang}" "site/${lang}"
          done
          for lang in zh ja es de fr pt ru ko; do
            test -f "site/${lang}/index.html"
          done
      # Stamp last-modified dates (docs/lastmod.json, generated in the source repo)
      # into JSON-LD, article:modified_time, a visible "Last updated" line and
      # every sitemap <url>. Runs on the nested site so all nine languages are covered.
      - name: Stamp last-modified dates
        run: python3 .github/scripts/inject-lastmod.py site
      # Share one copy of every image/PDF/XLSX: delete the byte-identical copies
      # inside site/<lang>/ and point that language's pages at the root copy.
      # Fails the deploy if any rewritten reference no longer resolves.
      - name: Share assets across languages
        run: python3 .github/scripts/dedupe-site-assets.py site zh ja es de fr pt ru ko
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
