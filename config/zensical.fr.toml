[project]

site_name = "μForge.io"

site_description = "μForge.io fournit des microcontrôleurs SF32 ultra-basse consommation, des modules, des cartes de développement, des flux de travail SDK et des guides de conception matérielle prêts pour la production aux développeurs embarqués."

site_author = "Jingming Wang"

site_url = "https://uForge.io/fr/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io · <a href='/fr/about/'>À propos de ce site</a> · <a href='/fr/about/glossary/'>Glossaire</a> · <a href='/fr/about/contact/'>Contact</a>
"""

