# Custom CSS/JS, paths relative to docs_dir.
extra_css = [
    "stylesheets/uforge-home.css",
    "stylesheets/hardware-overview.css",
    "stylesheets/extra.css",
    "stylesheets/product-selector.css",
]
extra_javascript = ["javascripts/product-selector.js", "javascripts/palette-sync.js", "javascripts/spotlight-hero.js"]

#last_updated = "true"
#[project.last_updated]
#format = "Last updated %B %d, %Y"

# ----------------------------------------------------------------------------
[project.theme]

#variant = "classic"  # traditional Material for MkDocs look

custom_dir = "overrides"

favicon = "assets/uforge-favicon.svg"

# UI language -- translates theme chrome, one per build.
language = "zh"

# Feature toggles. See https://zensical.org/docs/setup/ for what each does.
features = [
    "announce.dismiss",
    #"content.action.edit",
    #"content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    #"navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    #"toc.integrate",
]

logo = "assets/uforge-logo.svg"

[project.theme.icon]
repo = "fontawesome/brands/github"
alternate = "lucide/languages"
#logo = "lucide/smile"

#[project.theme.font]
text = "Josefin Sans"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "System"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Light"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Dark"

# Language switcher entries (name/lang shown in the header dropdown). The
# actual per-page target URL is computed in overrides/partials/alternate.html
# and overrides/main.html, not from the "link" value below -- see AGENTS.md's
# "Language switcher" section.
[[project.extra.alternate]]
name = "EN"
link = "/"
lang = "en"

[[project.extra.alternate]]
name = "Español"
link = "/es/"
lang = "es"

[[project.extra.alternate]]
name = "Français"
link = "/fr/"
lang = "fr"

[[project.extra.alternate]]
name = "Deutsch"
link = "/de/"
lang = "de"

[[project.extra.alternate]]
name = "Português"
link = "/pt/"
lang = "pt"

[[project.extra.alternate]]
name = "Русский"
link = "/ru/"
lang = "ru"

[[project.extra.alternate]]
name = "中文"
link = "/zh/"
lang = "zh"

[[project.extra.alternate]]
name = "日本語"
link = "/ja/"
lang = "ja"

[[project.extra.alternate]]
name = "한국어"
link = "/ko/"
lang = "ko"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:contact@uforge.io"
name = "联系我们"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/uforge-io/"
name = "前往 GitHub"

[[project.extra.social]]
