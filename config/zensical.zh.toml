[project]

site_name = "μForge.io"

site_description = "μForge.io 提供 SF32 超低功耗微控制器、模组、开发板、SDK 工作流程以及可直接用于量产的硬件设计指南的中文文档。"

site_author = "Jingming Wang"

# Provisional -- not wired into deployment yet; will point at the real
# published path for the Chinese tree once the bilingual site is deployed.
site_url = "https://uForge.io/zh/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io · <a href='/zh/about/'>关于</a> · <a href='/zh/about/glossary/'>术语表</a> · <a href='/zh/about/contact/'>联系我们</a>
"""

# Build for docs/zh/. Chinese twin of zensical.en.toml (English) -- extend its
# nav as docs/zh/ grows, the same way zensical.en.toml is extended as docs/
# grows.
docs_dir = "docs/zh"

# Separate from the English "site" output dir so the two builds don't
# clobber each other on disk.
site_dir = "site/zh"

