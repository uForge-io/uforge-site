    <text x="528" y="72">信道 37</text>
    <text x="716" y="72">信道 38</text>
    <text x="904" y="72">信道 39</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#284264">
    <rect x="130" y="557" width="20" height="14" fill="#7d7af0"/><text x="160" y="570">预处理</text>
    <rect x="398" y="557" width="20" height="14" fill="#9290ec"/><text x="428" y="570">晶振启动</text>
    <rect x="130" y="600" width="20" height="14" fill="#c5c4f5"/><text x="160" y="613">待机</text>
    <rect x="398" y="600" width="20" height="14" fill="#fbf589"/><text x="428" y="613">无线电启动</text>
