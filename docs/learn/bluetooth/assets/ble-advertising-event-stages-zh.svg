<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">BLE 广播事件阶段</title>
  <desc id="desc">BLE 广播事件各阶段的电流随时间变化示意图，依次为预处理、晶振启动、待机、无线电启动、发射、收发切换、接收、待机、发射、收发切换、接收、待机、发射、收发切换、接收和后处理。</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <g stroke="#e1e5e9" stroke-width="1">
    <line x1="120" y1="85" x2="1120" y2="85"/>
    <line x1="120" y1="157" x2="1120" y2="157"/>
    <line x1="120" y1="229" x2="1120" y2="229"/>
    <line x1="120" y1="301" x2="1120" y2="301"/>
    <line x1="120" y1="373" x2="1120" y2="373"/>
    <line x1="120" y1="445" x2="1120" y2="445"/>
    <line x1="120" y1="85" x2="120" y2="445"/>
    <line x1="470" y1="85" x2="470" y2="445"/>
    <line x1="820" y1="85" x2="820" y2="445"/>
  </g>
  <g stroke="#1e1e1e" stroke-width="2">
    <line x1="120" y1="65" x2="120" y2="445"/>
    <line x1="120" y1="445" x2="1120" y2="445"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#284264">
    <text x="104" y="452" font-size="18">0</text>
    <text x="103" y="380" font-size="18">1</text>
    <text x="103" y="308" font-size="18">2</text>
    <text x="103" y="236" font-size="18">3</text>
    <text x="103" y="164" font-size="18">4</text>
    <text x="103" y="92" font-size="18">5</text>
    <text x="22" y="280" font-size="24" transform="rotate(-90 22 280)">电流 (mA)</text>
    <text x="620" y="511" text-anchor="middle" font-size="24">时间 (ms)</text>
  </g>
  <g>
    <rect x="120" y="287" width="48" height="158" fill="#7d7af0"/>
    <rect x="168" y="377" width="110" height="68" fill="#9290ec"/>
    <rect x="278" y="402" width="170" height="43" fill="#c5c4f5"/>
    <rect x="448" y="272" width="45" height="173" fill="#fbf589"/>
    <rect x="493" y="85" width="70" height="360" fill="#b8d2b5"/>
    <rect x="563" y="362" width="50" height="83" fill="#faf7ce"/>
    <rect x="613" y="215" width="28" height="230" fill="#d6e8d1"/>
    <rect x="641" y="402" width="40" height="43" fill="#c5c4f5"/>
    <rect x="681" y="85" width="70" height="360" fill="#b8d2b5"/>
    <rect x="751" y="362" width="50" height="83" fill="#faf7ce"/>
    <rect x="801" y="215" width="28" height="230" fill="#d6e8d1"/>
    <rect x="829" y="402" width="40" height="43" fill="#c5c4f5"/>
    <rect x="869" y="85" width="70" height="360" fill="#b8d2b5"/>
    <rect x="939" y="362" width="50" height="83" fill="#faf7ce"/>
    <rect x="989" y="215" width="28" height="230" fill="#d6e8d1"/>
    <rect x="1017" y="359" width="103" height="86" fill="#d9d9f5"/>
