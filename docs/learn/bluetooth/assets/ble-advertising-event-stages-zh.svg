    <rect x="925" y="557" width="20" height="14" fill="#faf7ce"/><text x="955" y="570">收发切换</text>
    <rect x="675" y="600" width="20" height="14" fill="#d6e8d1"/><text x="705" y="613">无线接收</text>
    <rect x="925" y="600" width="20" height="14" fill="#d9d9f5"/><text x="955" y="613">后处理</text>
