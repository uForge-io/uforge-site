<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Illustrativer Wechsel der Energiemodi bei einer kurzen Arbeitslast</title>
  <desc id="desc">Relativer Stromverlauf vom Tiefschlaf über Aufwachen, aktive Arbeit und Leerlauf bis zurück in den Energiesparmodus.</desc>
  <style>
    .axis { stroke: #243b53; stroke-width: 2; }
    .grid { stroke: #dbe5ec; stroke-width: 1; }
    .trace { fill: none; stroke: #173f5f; stroke-linejoin: round; stroke-width: 4; }
    .label { fill: #243b53; font-family: Arial, sans-serif; font-size: 18px; }
    .small { fill: #486581; font-family: Arial, sans-serif; font-size: 15px; }
    .stage { fill: #102a43; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .callout { fill: #627d98; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
  </style>
  <rect width="1080" height="500" fill="#ffffff"/>
  <line class="grid" x1="120" y1="110" x2="1000" y2="110"/>
  <line class="grid" x1="120" y1="190" x2="1000" y2="190"/>
  <line class="grid" x1="120" y1="270" x2="1000" y2="270"/>
  <line class="grid" x1="120" y1="350" x2="1000" y2="350"/>
  <line class="axis" x1="120" y1="390" x2="1000" y2="390"/>
  <line class="axis" x1="120" y1="70" x2="120" y2="390"/>
  <text class="label" x="560" y="455" text-anchor="middle">Zeit</text>
  <text class="label" x="44" y="235" text-anchor="middle" transform="rotate(-90 44 235)">Relativer Strom</text>
  <text class="small" x="126" y="92">Höher</text>
  <text class="small" x="126" y="380">Niedriger</text>

  <rect x="120" y="350" width="190" height="40" fill="#b7d7e8"/>
  <rect x="310" y="275" width="110" height="115" fill="#f7d48b"/>
  <rect x="420" y="110" width="205" height="280" fill="#efae70"/>
  <rect x="625" y="260" width="155" height="130" fill="#a8d5c2"/>
  <rect x="780" y="150" width="105" height="240" fill="#efae70"/>
  <rect x="885" y="310" width="115" height="80" fill="#b7d7e8"/>
  <path class="trace" d="M120 350 H310 V275 H420 V110 H625 V260 H780 V150 H885 V310 H1000"/>

  <text class="stage" x="215" y="330">Tiefschlaf</text>
  <text class="stage" x="215" y="352">/ Bereitschaft</text>
  <text class="stage" x="365" y="255">Aufwachen</text>
  <text class="stage" x="522" y="92">Aktive Arbeit</text>
  <text class="stage" x="702" y="242">Leerlauf / Warten</text>
  <text class="stage" x="833" y="132">Aktive</text>
  <text class="stage" x="833" y="152">Arbeit</text>
  <text class="stage" x="943" y="290">Schlaf /</text>
  <text class="stage" x="943" y="310">Energiesparen</text>

  <line x1="310" y1="408" x2="310" y2="438" stroke="#627d98" stroke-width="1.5"/>
  <text class="callout" x="310" y="474">Weckquelle</text>
  <line x1="625" y1="408" x2="625" y2="438" stroke="#627d98" stroke-width="1.5"/>
  <text class="callout" x="625" y="474">Arbeit beendet</text>
  <line x1="885" y1="408" x2="885" y2="438" stroke="#627d98" stroke-width="1.5"/>
  <text class="callout" x="885" y="474">PM-Freigabe</text>
</svg>
