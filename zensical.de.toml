[project.theme]
custom_dir = "overrides"
favicon = "assets/uforge-favicon.svg"
language = "de"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

logo = "assets/uforge-logo.svg"

[project.theme.icon]
repo = "fontawesome/brands/github"
alternate = "lucide/languages"

text = "Josefin Sans"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Systemeinstellung"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Heller Modus"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Dunkler Modus"

