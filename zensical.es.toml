[project]

site_name = "μForge.io"

site_description = "μForge.io ofrece documentación en español sobre microcontroladores SF32 de ultra bajo consumo, módulos, placas de desarrollo, flujos de trabajo de SDK y guías de diseño de hardware listas para producción."

site_author = "Jingming Wang"

site_url = "https://uForge.io/es/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io · <a href='/es/about/'>Acerca de</a> · <a href='/es/about/glossary/'>Glosario</a> · <a href='/es/about/contact/'>Contacto</a>
"""

