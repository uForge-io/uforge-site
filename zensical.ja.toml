[project]

site_name = "μForge.io"

site_description = "μForge.io は、組み込み開発者向けに SF32 超低消費電力マイクロコントローラ、モジュール、開発ボード、SDK ワークフロー、量産対応ハードウェア設計ガイドを提供します。"

site_author = "Jingming Wang"

site_url = "https://uForge.io/ja/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io · <a href='/ja/about/'>このサイトについて</a> · <a href='/ja/about/glossary/'>用語集</a> · <a href='/ja/about/contact/'>お問い合わせ</a>
"""

