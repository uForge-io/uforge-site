[project]

site_name = "μForge.io"

site_description = "μForge.io는 임베디드 개발자를 위해 SF32 초저전력 마이크로컨트롤러, 모듈, 개발 보드, SDK 워크플로, 양산 대응 하드웨어 설계 가이드를 제공합니다."

site_author = "Jingming Wang"

site_url = "https://uForge.io/ko/"

repo_url = "https://github.com/uForge-io/uforge-site"

repo_name = "μForge-io/uforge-site"

copyright = """
Copyright &copy; 2026 μForge.io · <a href='/ko/about/'>사이트 소개</a> · <a href='/ko/about/glossary/'>용어집</a> · <a href='/ko/about/contact/'>문의</a>
"""

